# Dev container services. The image tag must equal the one in dev_tools/database.py
# (tests/test_database.py checks it). The password is a throwaway for a database
# that holds no data. `app` shares the `db` network namespace, so PostgreSQL is on
# 127.0.0.1:5432 and the fixtures' local-host guard holds.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: caverns
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    command: sleep infinity
    network_mode: service:db
    volumes:
      - ..:/workspace:cached
    environment:
      CAVERNS_TEST_DSN: postgresql://postgres:caverns@127.0.0.1:5432/postgres

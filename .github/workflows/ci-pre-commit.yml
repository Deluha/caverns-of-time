name: ci-pre-commit

# Zero-setup enforcement: runs the repo's pre-commit hooks on every pull request
# (and on pushes to main) so contributors don't need to install anything locally.
# This gates every hook registered at the pre-commit stage: project conventions,
# ruff and guidance-stack integrity. The docs-sync hook runs at the commit-msg
# stage instead and is covered by ci-docs-sync.yml; the pytest-fast hook runs at
# the pre-push stage and is covered by ci-tests.yml. The `language: system` hooks
# run the dev tools, so the job installs the dev extra (which carries pre-commit).
# Hook environments are cached (~/.cache/pre-commit, keyed on
# .pre-commit-config.yaml and the Python version).
#
# Secret scanning is a separate step, not the gitleaks hook: that hook inspects
# only STAGED changes, which are empty in CI, so it is skipped here (SKIP) and
# stays a local, pre-commit-time check. The step "Scan for secrets" downloads a
# pinned, checksum-verified gitleaks and scans (1) the commits a pull request
# adds (base..head), or on a push to main the pushed range (the whole history
# when the previous tip is unknown), and (2) the working tree, with
# .gitleaks.toml. The version below must equal the `rev` of the gitleaks hook in
# .pre-commit-config.yaml (the step checks it); both are bumped by hand, with the
# sha256 of the linux_x64 tarball from the release's checksums file.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads the pull request's / push's commit range.
          fetch-depth: 0
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project with the dev extra
        run: pip install -e ".[dev]"
      # pre-commit's hook environments (the `language: python` hooks build a
      # virtualenv each); keyed on the config and the exact interpreter, so a
      # hook bump or a new runner Python starts a fresh cache.
      - name: Cache the pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # --all-files makes the run independent of the diff. The staged-only gitleaks
      # hook is skipped (it would pass vacuously); the next steps run the real scan.
      - name: Run pre-commit hooks
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's
          # gitleaks_8.30.1_checksums.txt.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          grep -Eq "^[[:space:]]+rev: v${GITLEAKS_VERSION}$" .pre-commit-config.yaml || {
            echo "gitleaks version here differs from the hook rev in .pre-commit-config.yaml" >&2
            exit 1
          }
          bin="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bin"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
      - name: Scan for secrets (commit range and working tree)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "${PUSH_BEFORE//0/}" != "" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          echo "scanning commits: ${range:-all history}"
          if [ -n "$range" ]; then
            gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$range" .
          else
            gitleaks git --config .gitleaks.toml --redact --no-banner .
          fi
          echo "scanning the working tree"
          gitleaks dir --config .gitleaks.toml --redact --no-banner .
